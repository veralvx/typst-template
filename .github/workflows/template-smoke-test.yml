name: Template smoke test

# The template proven the only way that counts: generated with the real cargo-generate, for each
# kind, and the result put through what its own CI and `just checks` run. Weekly as well, because a
# template rots without a commit: a new Typst, a moved nixpkgs, a stricter package-check.
#
#   render-check   tools/render-check.py: every prompt combination renders and parses; the
#                  licence texts agree; the manifests describe their kind and licence
#   combinations   every kind x licence x email answer through the real cargo-generate: each
#                  typst.toml parses, each licence file is where its choice puts it, dprint
#                  passes; a name Universe would refuse, refused
#   generate       for each kind, with the tools its own CI installs: the git hooks refusing what
#                  CI would, `just checks` but the flake's, the oldest Typst (`just floor`), and
#                  real releases against a bare remote, each tag then bundled and linted as
#                  publish.yml does, and the last accepted by typst/packages' own bundler
#   nix            for each kind, generated by nixpkgs' cargo-generate: every system evaluated,
#                  the flake's checks built, and `just checks` but `nix` in its dev shell (its
#                  typst-package-check built from source)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# a pull request's newest run cancels its older ones; any other run, a group of its own
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  render-check:
    name: render-check.py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nix-instantiate: every rendered Nix file parsed
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Render every combination
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --requirement tools/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" tools/render-check.py

  combinations:
    name: Every answer combination
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-generate and cocogitto from their releases: no install action carries them
      - name: Install cargo-generate and cocogitto
        run: .github/install-release-tools.sh

      - name: Install dprint
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: dprint@0.61.1

      - name: Generate and check each
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/combinations"
          mkdir -p "$out"
          for kind in package template; do
            for licence in "MIT OR Apache-2.0" MIT Apache-2.0 MIT-0; do
              for email in jane@example.com ""; do
                name="c-$kind-$(tr -cd 'a-z0-9' <<< "${licence,,}")${email:+-e}"
                cargo generate --path "$GITHUB_WORKSPACE" template --name "$name" \
                  --destination "$out" --silent -d project_kind="$kind" \
                  -d "author_name=Jane Doe" -d "author_email=$email" -d github_username=jane \
                  -d "license=$licence" -d compiler=0.14.0 -d "keywords=demo, Some Organisation" \
                  -d disciplines=computer-science
                dir="$out/$name"
                python3 -c 'import sys, tomllib; tomllib.load(open(sys.argv[1], "rb"))' "$dir/typst.toml"
                # LICENSE always; the dual licence's texts; a template's MIT-0 text, unless MIT-0 is
                # the whole package's
                want="LICENSE"
                if [ "$licence" = "MIT OR Apache-2.0" ]; then want="$want LICENSE-APACHE LICENSE-MIT"; fi
                if [ "$kind" = template ] && [ "$licence" != MIT-0 ]; then want="$want LICENSE-MIT-0"; fi
                have="$(cd "$dir" && printf '%s\n' LICENSE* | sort | tr '\n' ' ')"
                if [ "$have" != "$(tr ' ' '\n' <<< "$want" | sort | tr '\n' ' ')" ]; then
                  echo "::error::$name has $have, expected $want" >&2
                  exit 1
                fi
                # template/: a template package's alone
                have=$([ -d "$dir/template" ] && echo template || echo package)
                if [ "$have" != "$kind" ]; then
                  echo "::error::$name's template/ says $have" >&2
                  exit 1
                fi
                (cd "$dir" && dprint check)
              done
            done
          done

      - name: What Universe would refuse is refused
        run: |
          set -euo pipefail
          # the destination must exist, or cargo-generate fails before the hook runs
          mkdir -p "$RUNNER_TEMP/refused"
          answers=(-d "author_name=Jane Doe" -d author_email= -d github_username=jane -d license=MIT
            -d compiler=0.14.0 -d keywords= -d disciplines=)
          # validate-name.rhai: a name that is no kebab-case identifier or holds "typst"; a
          # description with "Typst"; a GitHub handle past 39 characters (a regex counts no length)
          long="$(printf 'a-%.0s' $(seq 25))a"
          for case in "3d-plot" "typst-tools" "fine description=Draws Typst things." \
            "fine2 github_username=$long"; do
            read -r name answer <<< "$case"
            extra=()
            if [ -n "$answer" ]; then extra=(-d "$answer"); fi
            if cargo generate --path "$GITHUB_WORKSPACE" template --name "$name" \
              --destination "$RUNNER_TEMP/refused" --silent -d project_kind=package \
              "${answers[@]}" "${extra[@]}" > "$RUNNER_TEMP/refused.log" 2>&1; then
              echo "::error::$case was not refused" >&2
              exit 1
            fi
            if ! grep -q -- '-- choose another' "$RUNNER_TEMP/refused.log"; then
              echo "::error::$case failed, but not by the hook:" >&2
              cat "$RUNNER_TEMP/refused.log" >&2
              exit 1
            fi
          done
          # a template package without a category (its regex)
          if cargo generate --path "$GITHUB_WORKSPACE" template --name no-category \
            --destination "$RUNNER_TEMP/refused" --silent -d project_kind=template -d categories= \
            "${answers[@]}" > "$RUNNER_TEMP/refused.log" 2>&1; then
            echo "::error::a template package without a category was not refused" >&2
            exit 1
          fi
          grep -q 'is not a valid value for categories' "$RUNNER_TEMP/refused.log"

  generate:
    name: Generate (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [package, template]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-generate and cocogitto from their releases: no install action carries them
      - name: Install cargo-generate and cocogitto
        run: .github/install-release-tools.sh

      - name: Install dprint and git-cliff
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: dprint@0.61.1,git-cliff@2.14.2

      - name: Generate
        id: generate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generated"
          cargo generate --path "$GITHUB_WORKSPACE" template --name demo \
            --destination "$RUNNER_TEMP/generated" --silent -d project_kind=${{ matrix.kind }} \
            -d "author_name=Jane Doe" -d author_email=jane@example.com -d github_username=jane \
            -d "license=MIT OR Apache-2.0" -d compiler=0.14.0 -d "keywords=demo" -d disciplines=
          cd "$RUNNER_TEMP/generated/demo"
          # in git's config, not GIT_AUTHOR_NAME and the like: `cog verify` reads it there
          git config user.name smoke
          git config user.email smoke@example.com
          git add .
          git commit --quiet -m "chore: initial commit from template"
          # the versions the generated project's own CI reads
          sed -n 's/^\([a-z-]*\) = "\([^"]*\)".*/\1=\2/p' tools.toml >> "$GITHUB_OUTPUT"
          sed -n 's/^compiler = "\([^"]*\)".*/compiler=\1/p' typst.toml >> "$GITHUB_OUTPUT"

      # as the generated checks.yml installs them: the oldest Typst first, so the pinned one's
      # directory, added to PATH after it, is the one `typst` names
      - name: Install the oldest Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ steps.generate.outputs.compiler }}
          executable-name: typst-${{ steps.generate.outputs.compiler }}

      - name: Install the pinned Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ steps.generate.outputs.typst }}

      - name: Install tytanic
        uses: typst-community/setup-tytanic@91194b909ce8657f9010b1052bd098bb43d6dbcb # v1.1.0
        with:
          tytanic-version: ${{ steps.generate.outputs.tytanic }}

      - name: Install just, shellcheck and shfmt
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@${{ steps.generate.outputs.just }},shellcheck@${{ steps.generate.outputs.shellcheck }},shfmt@${{ steps.generate.outputs.shfmt }}

      - name: Install typstyle and typst-package-check
        working-directory: ${{ runner.temp }}/generated/demo
        env:
          TYPSTYLE: ${{ steps.generate.outputs.typstyle }}
          PACKAGE_CHECK: ${{ steps.generate.outputs['typst-package-check'] }}
        run: .github/install-tools.sh

      # installed for every step below, so the releases commit and push through them too
      - name: The git hooks refuse what CI would
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          refused() {
            if "$@"; then echo "::error::not refused: $*" >&2; exit 1; fi
          }
          just install-hooks
          # pre-commit: Typst code typstyle would reformat
          printf '\n#let  unformatted =  0\n' >> src/lib.typ
          refused git commit --quiet -am "style: unformatted"
          git checkout -- src/lib.typ
          # pre-commit: an import of a version typst.toml does not declare
          sed -i 's|@preview/demo:0.1.0|@preview/demo:0.0.1|' README.md
          refused git commit --quiet -am "docs: a stale import"
          git checkout -- README.md
          # commit-msg: a message that is no Conventional Commit
          refused git commit --quiet --allow-empty -m "not conventional"
          # pre-push: a revert, which git commits without running commit-msg
          git init --quiet --bare "$RUNNER_TEMP/hooks.git"
          echo probe > probe.txt
          git add probe.txt
          git commit --quiet -m "docs: a probe"
          git revert --no-edit HEAD
          refused git push --quiet "$RUNNER_TEMP/hooks.git" HEAD:main
          git reset --quiet --hard HEAD~2
          git push --quiet "$RUNNER_TEMP/hooks.git" HEAD:main

      # `just checks` less `nix` (the nix job's), as the generated checks.yml runs them
      - name: just checks
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          just --fmt --check --unstable
          just tools-check format-check shell-check test versions-check readme-check template-check \
            package-check dprint-check cog

      - name: The oldest Typst (just floor)
        working-directory: ${{ runner.temp }}/generated/demo
        run: just floor

      # the recipe that writes, commits, tags and pushes, against a bare remote: every step as a
      # maintainer runs it, each release after a push (it releases origin's main alone); then
      # each tag as publish.yml reads it, at its own commit
      - name: Releases
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          git init --quiet --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push --quiet origin main
          git commit --quiet --allow-empty -m "feat: a first feature"
          git push --quiet origin main
          just release minor
          git commit --quiet --allow-empty -m "fix!: a breaking fix"
          git push --quiet origin main
          just release minor
          test "$(git -C "$RUNNER_TEMP/origin.git" tag | tr '\n' ' ')" = "v0.1.0 v0.2.0 "
          grep -q '^version = "0.2.0"' typst.toml
          grep -q '@preview/demo:0.2.0' README.md
          grep -q '^## \[0.2.0\](https://github.com/jane/demo/compare/v0.1.0..v0.2.0)' CHANGELOG.md
          just versions-check
          if just release patch; then
            echo "::error::a release with nothing new was not refused" >&2
            exit 1
          fi
          # a commit CI never ran on, a release otherwise: refused until pushed
          git commit --quiet --allow-empty -m "fix: unpushed"
          if out=$(just release patch 2>&1); then
            echo "::error::a release of an unpushed main was not refused" >&2
            exit 1
          fi
          grep -q "main is not origin/main" <<< "$out"
          git reset --quiet --hard origin/main
          for tag in $(git tag); do
            git checkout --quiet "$tag"
            version="$(just manifest package.version)"
            test "v$version" = "$tag"
            .github/release-notes.sh CHANGELOG.md "$version" > /dev/null
            just package-check
          done
          git checkout --quiet main

      # what package-check does not check, typst/packages' deploy does: its bundler, built from
      # its main, run on the last release's bundle laid out as the repository holds it (the
      # licence's SPDX terms, the authors, the categories, the thumbnail's size and edge)
      - name: typst/packages' bundler accepts the bundle
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/typst/packages "$RUNNER_TEMP/packages"
          git -C "$RUNNER_TEMP/packages" sparse-checkout set bundler
          cargo build --quiet --release --manifest-path "$RUNNER_TEMP/packages/bundler/Cargo.toml"
          just bundle
          mkdir -p "$RUNNER_TEMP/universe/packages"
          cp -R dist/preview "$RUNNER_TEMP/universe/packages/"
          cd "$RUNNER_TEMP/universe"
          "$RUNNER_TEMP/packages/bundler/target/release/bundler"
          test -f dist/preview/demo-0.2.0.tar.gz

  nix:
    name: Nix (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [package, template]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Generate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/generated"
          nix run nixpkgs#cargo-generate -- generate --path "$GITHUB_WORKSPACE" template \
            --name demo --destination "$RUNNER_TEMP/generated" --silent \
            -d project_kind=${{ matrix.kind }} -d "author_name=Jane Doe" \
            -d author_email=jane@example.com -d github_username=jane \
            -d "license=MIT OR Apache-2.0" -d compiler=0.14.0 -d "keywords=demo" -d disciplines=
          # nixpkgs builds cargo-generate without its `git` feature, so no repository is made; and
          # a git flake sees tracked files only
          cd "$RUNNER_TEMP/generated/demo"
          git init --quiet -b main
          git config user.name smoke
          git config user.email smoke@example.com
          git add .
          git commit --quiet -m "chore: initial commit from template"

      - name: just nix (every system evaluated, this one's checks built)
        working-directory: ${{ runner.temp }}/generated/demo
        run: nix develop --command just nix

      - name: just checks in the dev shell, but `nix`
        working-directory: ${{ runner.temp }}/generated/demo
        run: |
          nix develop --command just tools-check format-check shell-check test versions-check readme-check \
            template-check package-check dprint-check cog
